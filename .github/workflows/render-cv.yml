name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # rendercv v2.3 (single-file format in _data/cv.yml; relative paths resolve
      # from the input file's directory, so render from within _data/)
      - name: Install RenderCV
        run: pip install "rendercv[full]==2.3.*"
      - name: RenderCV
        run: |
          cd _data
          python -m rendercv render cv.yml
          rm -f ../assets/rendercv/rendercv_output/*.typ
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV" || echo "No changes to commit"
          git push
