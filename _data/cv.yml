# RenderCV settings (v2.3 single-file format; the website reads only the `cv` key below)
# Paths are relative to this file's directory (_data/)
rendercv_settings:
  render_command:
    design: ../assets/rendercv/design.yaml
    locale: ../assets/rendercv/locale.yaml
    typst_path: ../assets/rendercv/rendercv_output/Fashu_Xu_CV.typ
    pdf_path: ../assets/rendercv/rendercv_output/Fashu_Xu_CV.pdf
    markdown_path: ../assets/rendercv/rendercv_output/Fashu_Xu_CV.md
